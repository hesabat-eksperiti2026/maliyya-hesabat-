<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maliyyə Nəzarəti - Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Excel üçün kitabxana -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0c0f14;
      --card: rgba(255,255,255,0.05);
      --stroke: rgba(255,255,255,0.1);
      --yellow: #ff9f1a;
      --green: #2ee59d;
      --red: #ff6b6b;
      --text: #ffffff;
    }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    
    /* Header & Selects */
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    select, input { background: #1a1f26; border: 1px solid var(--stroke); color: #fff; padding: 10px; border-radius: 10px; outline: none; }
    
    /* Status Notification */
    .status-alert { padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: 700; text-align: center; border: 1px solid var(--stroke); }
    .status-good { background: rgba(46,229,157,0.15); color: var(--green); border-color: var(--green); }
    .status-warning { background: rgba(255,159,26,0.15); color: var(--yellow); border-color: var(--yellow); }
    .status-danger { background: rgba(255,107,107,0.15); color: var(--red); border-color: var(--red); }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: var(--card); color: #fff; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .tab-btn.active { background: var(--yellow); color: #000; }

    /* Tables */
    .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { text-align: left; font-size: 12px; color: var(--yellow); padding: 10px; border-bottom: 1px solid var(--stroke); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }

    /* Analytics Styles */
    .ana-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 10px; padding: 12px; border-bottom: 1px solid var(--stroke); align-items: center; }
    .progress-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; grid-column: span 4; margin-top: 5px; position: relative; }
    .progress-fill { height: 100%; border-radius: 10px; transition: 0.4s; }

    .btn-add { background: var(--yellow); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-export { background: #fff; color: #000; font-size: 12px; margin-top: 10px; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="top-nav">
    <div>
      <h2 style="margin:0">Maliyyə Planlayıcı</h2>
      <select id="monthSelector" onchange="changeMonth()">
        <option value="May_2026">May 2026</option>
        <option value="Iyun_2026">İyun 2026</option>
        <option value="Iyul_2026">İyul 2026</option>
      </select>
    </div>
    <button class="btn-add btn-export" onclick="exportToExcel()">Excel-ə çıxar (.xlsx)</button>
  </div>

  <!-- Ağıllı Bildiriş -->
  <div id="smartAlert" class="status-alert status-good">
    Yüklənir...
  </div>

  <div class="tabs">
    <button id="btn-plan" class="tab-btn active" onclick="switchTab('plan')">Planlama</button>
    <button id="btn-ana" class="tab-btn" onclick="switchTab('ana')">Analitika (Hədəf vs Real)</button>
  </div>

  <!-- PLANLAMA -->
  <div id="section-plan" class="card">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div>
        <label style="font-size:12px">Kateqoriya Seç:</label>
        <select id="catSelect" style="width:100%"></select>
      </div>
      <div>
        <label style="font-size:12px">Məbləğ (₼):</label>
        <input type="number" id="amtInput" style="width:100%" placeholder="Məs: 50">
      </div>
    </div>
    <button class="btn-add" onclick="addNewExpense()">Əlavə Et</button>

    <table>
      <thead>
        <tr>
          <th>KATEQORİYA</th>
          <th>MƏBLƏĞ</th>
          <th>TARİX</th>
          <th>SİL</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>
  </div>

  <!-- ANALİTİKA -->
  <div id="section-ana" class="card hidden">
    <div class="ana-row" style="font-weight:bold; border-bottom: 2px solid var(--yellow); color: var(--yellow)">
      <div>Kateqoriya</div>
      <div>Hədəf</div>
      <div>Xərc</div>
      <div>Qalıq</div>
    </div>
    <div id="analyticsBody"></div>
  </div>
</div>

<script>
  // Sabit Kateqoriyalar və Limitlər
  const defaultTargets = {
    "Kredit": 650, "Şaxnuz maaş": 500, "Komunal": 100, "Xalidə x. komunal": 80,
    "Kontur": 30, "Borc": 100, "Ehtiyat pul": 0, "Benzin": 50, "İstirahət": 350,
    "Paltar": 50, "Baxım": 50, "Həkim": 0, "Bazarlıq": 400, "ARslan bazarlıq": 250,
    "Ət": 50, "Restoran": 100
  };

  let db = JSON.parse(localStorage.getItem('fin_v4_db')) || {};
  let currentMonth = document.getElementById('monthSelector').value;

  function init() {
    // Kateqoriya seçimini doldur
    const select = document.getElementById('catSelect');
    select.innerHTML = "";
    Object.keys(defaultTargets).forEach(cat => {
      select.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    if (!db[currentMonth]) db[currentMonth] = [];
    render();
  }

  function changeMonth() {
    currentMonth = document.getElementById('monthSelector').value;
    if (!db[currentMonth]) db[currentMonth] = [];
    render();
  }

  function addNewExpense() {
    const cat = document.getElementById('catSelect').value;
    const amt = parseFloat(document.getElementById('amtInput').value);
    if (!amt || amt <= 0) return;

    db[currentMonth].push({
      cat, amt, date: new Date().toLocaleDateString('az-AZ')
    });
    
    document.getElementById('amtInput').value = "";
    save();
    render();
  }

  function deleteItem(idx) {
    db[currentMonth].splice(idx, 1);
    save();
    render();
  }

  function save() {
    localStorage.setItem('fin_v4_db', JSON.stringify(db));
  }

  function switchTab(type) {
    document.getElementById('section-plan').classList.toggle('hidden', type !== 'plan');
    document.getElementById('section-ana').classList.toggle('hidden', type !== 'ana');
    document.getElementById('btn-plan').classList.toggle('active', type === 'plan');
    document.getElementById('btn-ana').classList.toggle('active', type === 'ana');
    if(type === 'ana') renderAnalytics();
  }

  function render() {
    const list = document.getElementById('expenseList');
    list.innerHTML = "";
    db[currentMonth].forEach((item, i) => {
      list.innerHTML += `
        <tr>
          <td><b>${item.cat}</b></td>
          <td>${item.amt} ₼</td>
          <td style="font-size:11px; color:var(--muted)">${item.date}</td>
          <td><button onclick="deleteItem(${i})" style="background:none; border:none; color:var(--red); cursor:pointer;">×</button></td>
        </tr>
      `;
    });
    updateSmartAlert();
    if(!document.getElementById('section-ana').classList.contains('hidden')) renderAnalytics();
  }

  function renderAnalytics() {
    const body = document.getElementById('analyticsBody');
    body.innerHTML = "";

    Object.keys(defaultTargets).forEach(cat => {
      const target = defaultTargets[cat];
      const spent = db[currentMonth].filter(i => i.cat === cat).reduce((s, i) => s + i.amt, 0);
      const diff = target - spent;
      const perc = target > 0 ? Math.min((spent / target) * 100, 100) : (spent > 0 ? 100 : 0);
      
      const statusColor = diff < 0 ? 'var(--red)' : 'var(--green)';
      const barColor = diff < 0 ? 'var(--red)' : 'var(--yellow)';

      body.innerHTML += `
        <div class="ana-row">
          <div style="font-size:13px"><b>${cat}</b></div>
          <div style="color:var(--yellow)">${target} ₼</div>
          <div style="font-weight:bold">${spent} ₼</div>
          <div style="color:${statusColor}; font-weight:900">${diff > 0 ? '+'+diff : diff} ₼</div>
          <div class="progress-bg">
            <div class="progress-fill" style="width:${perc}%; background:${barColor}"></div>
          </div>
        </div>
      `;
    });
  }

  function updateSmartAlert() {
    const alert = document.getElementById('smartAlert');
    let totalTarget = Object.values(defaultTargets).reduce((a, b) => a + b, 0);
    let totalSpent = db[currentMonth].reduce((s, i) => s + i.amt, 0);
    let diff = totalTarget - totalSpent;

    if (totalSpent === 0) {
      alert.className = "status-alert status-good";
      alert.innerText = "Yeni ay başladı! Hədəflərinə sadiq qal.";
    } else if (diff < 0) {
      alert.className = "status-alert status-danger";
      alert.innerText = "DİQQƏT! Ümumi büdcəni " + Math.abs(diff) + " ₼ aşmısan. Xərcləri dayandır!";
    } else if (diff < 200) {
      alert.className = "status-alert status-warning";
      alert.innerText = "Ehtiyatlı ol, büdcənin sonuna yaxınlaşırsan. Qalıq: " + diff + " ₼";
    } else {
      alert.className = "status-alert status-good";
      alert.innerText = "Hər şey qaydasındadır. " + diff + " ₼ hələ də sərbəst büdcən var.";
    }
  }

  function exportToExcel() {
    const data = db[currentMonth].map(i => ({
      "Kateqoriya": i.cat,
      "Məbləğ (₼)": i.amt,
      "Tarix": i.date
    }));
    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Xərclər");
    XLSX.writeFile(workbook, `Hesabat_${currentMonth}.xlsx`);
  }

  init();
</script>

</body>
</html>
