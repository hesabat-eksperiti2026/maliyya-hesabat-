<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maliyyə Hesabatı - Pro Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0f14;
      --stroke: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --yellow: #ff9f1a;
      --yellow2: #ff7a00;
      --good: #2ee59d;
      --bad: #ff6b6b;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 18px;
      --pillRadius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: 
        radial-gradient(900px 520px at 20% 10%, rgba(255,159,26,.16), transparent 60%),
        radial-gradient(900px 520px at 82% 18%, rgba(46,229,157,.10), transparent 60%),
        var(--bg);
      min-height: 100vh;
      padding: 20px;
    }

    .wrap { max-width: 1100px; margin: 0 auto; }

    /* Top Panel */
    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    .pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--stroke);
      padding: 12px 20px;
      border-radius: var(--pillRadius);
      backdrop-filter: blur(10px);
    }

    .pill input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-weight: 900;
      font-size: 18px;
      width: 100px;
      outline: none;
      text-align: right;
    }

    /* Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 15px 20px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--stroke);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Table Styles */
    table { width: 100%; border-collapse: collapse; }
    th { 
      background: var(--yellow); 
      color: #000; 
      font-size: 12px; 
      text-transform: uppercase; 
      padding: 12px;
      text-align: left;
    }
    td { padding: 12px; border-bottom: 1px solid var(--stroke); }

    input.table-input {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--stroke);
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      width: 100%;
      outline: none;
    }

    .heat-high { border-left: 4px solid var(--bad); }
    .heat-low { border-left: 4px solid var(--good); }

    /* Buttons */
    button {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-add { background: var(--yellow); color: #000; }
    .btn-pay { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-pay.done { background: var(--good); color: #000; }
    .btn-del { background: transparent; color: var(--bad); font-size: 18px; }

    /* Footer Stats */
    .card-footer { padding: 20px; background: rgba(0,0,0,0.2); }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .stat-val { font-weight: 900; font-size: 20px; }

    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--yellow); transition: 0.3s; }

  </style>
</head>
<body>

<div class="wrap">
  <div class="header-box">
    <div>
      <h1 style="margin:0; font-size:24px;">Maliyyə Paneli 2026</h1>
      <p style="color:var(--muted); margin:5px 0 0;">Xərclərinizi izləyin və idarə edin</p>
    </div>
    
    <div style="display:flex; gap:10px;">
        <div class="pill">
            <span style="font-size:12px; color:var(--muted)">AY:</span>
            <select id="monthSelect" style="background:none; border:none; color:#fff; font-weight:700; outline:none; cursor:pointer;">
                <option value="Yanvar_2026">Yanvar 2026</option>
                <option value="Fevral_2026">Fevral 2026</option>
                <option value="Mart_2026">Mart 2026</option>
                <option value="Aprel_2026">Aprel 2026</option>
                <option value="May_2026">May 2026</option>
            </select>
        </div>
        <div class="pill">
            <span style="font-size:12px; color:var(--muted)">BÜDCƏ:</span>
            <input type="number" id="budgetInput" value="2000"> <span>₼</span>
        </div>
    </div>
  </div>

  <div class="main-grid">
    <div class="card">
      <div class="card-header">
        <strong>Xərclər Siyahısı</strong>
        <button class="btn-add" onclick="addRow()">+ Yeni Sətir</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th style="width:50%">Mənbə / Kateqoriya</th>
            <th style="width:25%">Məbləğ</th>
            <th style="width:25%">Status</th>
          </tr>
        </thead>
        <tbody id="expenseTable">
          <!-- Sətirlər JS ilə bura gələcək -->
        </tbody>
      </table>

      <div class="card-footer">
        <div class="stat-row">
          <span>Ümumi Xərc:</span>
          <span class="stat-val" id="totalExp">0 ₼</span>
        </div>
        <div class="stat-row">
          <span>Qalıq Balans:</span>
          <span class="stat-val" id="balanceVal" style="color:var(--good)">0 ₼</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="bar"></div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:20px;">
      <h3 style="margin-top:0">İllik Yığım Hesabatı</h3>
      <div id="annualSummary">
         <!-- Kateqoriya cəmləri -->
      </div>
      <hr style="border:0; border-top:1px solid var(--stroke); margin:20px 0;">
      <button onclick="exportData()" style="width:100%; margin-bottom:10px;">Ehtiyat Nüsxə Yüklə (JSON)</button>
      <button onclick="clearAll()" style="width:100%; background:rgba(255,107,107,0.1); color:var(--bad)">Bütün Datanı Sil</button>
    </div>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('my_finances_2026')) || {};
  let currentMonth = "Yanvar_2026";

  const monthSelect = document.getElementById('monthSelect');
  const budgetInput = document.getElementById('budgetInput');

  function init() {
    currentMonth = monthSelect.value;
    if(!db[currentMonth]) {
      db[currentMonth] = { budget: 2000, items: [] };
    }
    budgetInput.value = db[currentMonth].budget;
    render();
  }

  function render() {
    const container = document.getElementById('expenseTable');
    container.innerHTML = "";
    let total = 0;

    db[currentMonth].items.forEach((item, index) => {
      const val = parseFloat(item.amount) || 0;
      total += val;

      const tr = document.createElement('tr');
      if(val > 500) tr.className = "heat-high";
      if(val > 0 && val < 50) tr.className = "heat-low";

      tr.innerHTML = `
        <td>
          <input class="table-input" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)" placeholder="Məs: Market">
          <select onchange="updateItem(${index}, 'cat', this.value)" style="background:none; color:var(--muted); border:none; font-size:10px; outline:none;">
            <option value="Digər" ${item.cat==='Digər'?'selected':''}>Digər</option>
            <option value="Yığım" ${item.cat==='Yığım'?'selected':''}>İllik Yığım</option>
            <option value="Kommunal" ${item.cat==='Kommunal'?'selected':''}>Kommunal</option>
          </select>
        </td>
        <td>
          <input type="number" class="table-input" value="${item.amount}" onchange="updateItem(${index}, 'amount', this.value)">
        </td>
        <td style="text-align:right">
          <button class="btn-pay ${item.paid ? 'done' : ''}" onclick="togglePaid(${index})">${item.paid ? '✓' : 'Ödə'}</button>
          <button class="btn-del" onclick="deleteItem(${index})">×</button>
        </td>
      `;
      container.appendChild(tr);
    });

    // Update Stats
    const budget = parseFloat(budgetInput.value) || 0;
    const balance = budget - total;
    document.getElementById('totalExp').innerText = total.toFixed(2) + " ₼";
    document.getElementById('balanceVal').innerText = balance.toFixed(2) + " ₼";
    document.getElementById('balanceVal').style.color = balance < 0 ? 'var(--bad)' : 'var(--good)';
    
    const perc = Math.min((total / budget) * 100, 100);
    document.getElementById('bar').style.width = perc + "%";

    updateAnnual();
    localStorage.setItem('my_finances_2026', JSON.stringify(db));
  }

  function addRow() {
    db[currentMonth].items.push({ name: "", amount: 0, cat: "Digər", paid: false });
    render();
  }

  function updateItem(index, key, val) {
    db[currentMonth].items[index][key] = val;
    render();
  }

  function togglePaid(index) {
    db[currentMonth].items[index].paid = !db[currentMonth].items[index].paid;
    render();
  }

  function deleteItem(index) {
    db[currentMonth].items.splice(index, 1);
    render();
  }

  function updateAnnual() {
    let savings = 0;
    Object.keys(db).forEach(m => {
        db[m].items.forEach(i => {
            if(i.cat === "Yığım") savings += (parseFloat(i.amount) || 0);
        });
    });
    document.getElementById('annualSummary').innerHTML = `
        <div style="background:rgba(46,229,157,0.1); padding:15px; border-radius:10px;">
            <div style="font-size:12px; color:var(--muted)">TOPLAM YIĞIM:</div>
            <div style="font-size:24px; font-weight:900; color:var(--good)">${savings.toFixed(2)} ₼</div>
        </div>
    `;
  }

  monthSelect.onchange = (e) => { currentMonth = e.target.value; init(); };
  budgetInput.oninput = (e) => { db[currentMonth].budget = e.target.value; render(); };

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", "maliyya_backup.json");
    a.click();
  }

  function clearAll() {
    if(confirm("Bütün datanı silmək istədiyinizə əminsiniz?")) {
        db = {};
        localStorage.clear();
        init();
    }
  }

  init();
</script>

</body>
</html>
