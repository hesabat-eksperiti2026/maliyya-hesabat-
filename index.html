<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maliyyə Paneli v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0f14;
      --card-bg: rgba(255,255,255,0.04);
      --stroke: rgba(255,255,255,0.1);
      --text: #ffffff;
      --muted: #8a8f98;
      --yellow: #ff9f1a;
      --good: #2ee59d;
      --bad: #ff6b6b;
      --shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    body {
      margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px;
      background-image: radial-gradient(circle at top right, rgba(255,159,26,0.08), transparent);
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Header & Tabs */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .tabs { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 12px; margin-bottom: 25px; }
    .tab-btn { 
      flex: 1; padding: 10px; border: none; background: none; color: var(--muted); cursor: pointer; 
      border-radius: 8px; font-weight: 600; transition: 0.3s; 
    }
    .tab-btn.active { background: var(--yellow); color: #000; }

    /* Stats Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--stroke); padding: 20px; border-radius: 15px; text-align: center; }
    .stat-card span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .stat-card b { font-size: 22px; font-weight: 900; }

    /* Forms & Tables */
    .card { background: var(--card-bg); border: 1px solid var(--stroke); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
    .section { display: none; padding: 20px; }
    .section.active { display: block; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--stroke); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

    input, select { 
      background: rgba(0,0,0,0.3); border: 1px solid var(--stroke); color: #fff; padding: 8px; 
      border-radius: 8px; width: 100%; outline: none; font-family: inherit;
    }

    button.add-btn { background: var(--yellow); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    
    /* Analytics UI */
    .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 10px; }
    .cat-info { display: flex; align-items: center; gap: 12px; }
    .cat-dot { width: 10px; height: 10px; border-radius: 50%; }
    .cat-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.05); margin: 0 15px; border-radius: 10px; position: relative; }
    .cat-bar-fill { position: absolute; height: 100%; border-radius: 10px; transition: 0.5s; }

    .btn-pay { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--stroke); background: none; color: #fff; cursor: pointer; }
    .btn-pay.paid { background: var(--good); color: #000; border: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1 style="margin:0">Maliyyə İdarəetmə</h1>
      <p id="currentDate" style="color:var(--muted); margin:5px 0 0; font-size: 13px;"></p>
    </div>
    <div style="text-align: right;">
        <span style="font-size:11px; color:var(--muted)">AYLIQ BÜDCƏ</span><br>
        <input type="number" id="mainBudget" value="2500" style="width:100px; font-weight:900; font-size:18px; color:var(--yellow); text-align:right; border:none; background:none;"> <b style="color:var(--yellow)">₼</b>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('planning')">Planlama (Cədvəl)</button>
    <button class="tab-btn" onclick="showTab('analytics')">Analitika (Bölgü)</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><span>Ümumi Xərc</span><b id="totalSpent">0 ₼</b></div>
    <div class="stat-card"><span>Qalıq Balans</span><b id="balance" style="color:var(--good)">0 ₼</b></div>
    <div class="stat-card"><span>İllik Yığım</span><b id="annualSavings" style="color:var(--yellow)">0 ₼</b></div>
  </div>

  <div class="card">
    <!-- Planning Section -->
    <div id="planning" class="section active">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
        <strong style="font-size:18px">Xərc Siyahısı</strong>
        <button class="add-btn" onclick="addRow()">+ Yeni Xərc</button>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:40%">Mənbə</th>
            <th style="width:25%">Kateqoriya</th>
            <th style="width:20%">Məbləğ</th>
            <th style="width:15%">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <!-- Analytics Section -->
    <div id="analytics" class="section">
      <strong style="font-size:18px; display:block; margin-bottom:20px;">Kateqoriya üzrə xərclər</strong>
      <div id="categoryList">
        <!-- JS ilə dolacaq -->
      </div>
    </div>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('fin_v3_data')) || [];
  let budget = localStorage.getItem('fin_v3_budget') || 2500;

  const categories = [
    { name: "Market", color: "#3498db" },
    { name: "Restoran/Kafe", color: "#e67e22" },
    { name: "Nəqliyyat", color: "#9b59b6" },
    { name: "Kommunal", color: "#f1c40f" },
    { name: "İllik Yığım", color: "#2ecc71" },
    { name: "Geyim/Şəxsi", color: "#e74c3c" },
    { name: "Digər", color: "#95a5a6" }
  ];

  function showTab(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
    if(id === 'analytics') renderAnalytics();
  }

  function addRow() {
    db.push({ name: "", cat: "Market", amt: 0, paid: false });
    render();
  }

  function updateItem(idx, key, val) {
    db[idx][key] = val;
    save();
    updateStats();
  }

  function deleteItem(idx) {
    db.splice(idx, 1);
    render();
  }

  function togglePaid(idx) {
    db[idx].paid = !db[idx].paid;
    render();
  }

  function save() {
    localStorage.setItem('fin_v3_data', JSON.stringify(db));
    localStorage.setItem('fin_v3_budget', budget);
  }

  function updateStats() {
    let total = db.reduce((s, i) => s + (parseFloat(i.amt) || 0), 0);
    let savings = db.filter(i => i.cat === "İllik Yığım").reduce((s, i) => s + (parseFloat(i.amt) || 0), 0);
    
    document.getElementById('totalSpent').innerText = total.toFixed(2) + " ₼";
    document.getElementById('balance').innerText = (budget - total).toFixed(2) + " ₼";
    document.getElementById('annualSavings').innerText = savings.toFixed(2) + " ₼";
    
    document.getElementById('balance').style.color = (budget - total) < 0 ? 'var(--bad)' : 'var(--good)';
  }

  function render() {
    const tbody = document.getElementById('rows');
    tbody.innerHTML = "";
    db.forEach((item, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input value="${item.name}" onchange="updateItem(${i}, 'name', this.value)" placeholder="Məs: Bolmart"></td>
        <td>
          <select onchange="updateItem(${i}, 'cat', this.value)">
            ${categories.map(c => `<option value="${c.name}" ${item.cat===c.name?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </td>
        <td><input type="number" value="${item.amt}" onchange="updateItem(${i}, 'amt', this.value)"></td>
        <td style="display:flex; gap:5px;">
          <button class="btn-pay ${item.paid?'paid':''}" onclick="togglePaid(${i})">${item.paid?'✓':'Ödə'}</button>
          <button onclick="deleteItem(${i})" style="background:none; border:none; color:var(--bad); cursor:pointer;">×</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    updateStats();
    save();
  }

  function renderAnalytics() {
    const list = document.getElementById('categoryList');
    list.innerHTML = "";
    let total = db.reduce((s, i) => s + (parseFloat(i.amt) || 0), 0);

    categories.forEach(cat => {
      let catSum = db.filter(i => i.cat === cat.name).reduce((s, i) => s + (parseFloat(i.amt) || 0), 0);
      let perc = total > 0 ? (catSum / total * 100).toFixed(1) : 0;

      list.innerHTML += `
        <div class="cat-row">
          <div class="cat-info" style="width:150px">
            <div class="cat-dot" style="background:${cat.color}"></div>
            <span>${cat.name}</span>
          </div>
          <div class="cat-bar-bg">
            <div class="cat-bar-fill" style="width:${perc}%; background:${cat.color}"></div>
          </div>
          <div style="width:100px; text-align:right">
            <b>${catSum.toFixed(2)} ₼</b><br>
            <small style="color:var(--muted)">${perc}%</small>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('mainBudget').oninput = (e) => {
    budget = e.target.value;
    updateStats();
    save();
  };

  document.getElementById('currentDate').innerText = new Date().toLocaleDateString('az-AZ', { day:'numeric', month:'long', year:'numeric' });

  render();
</script>

</body>
</html>
