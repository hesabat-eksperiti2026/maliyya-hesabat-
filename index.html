<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Maliyyə Pro - Mobil Uyğun</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0b0e14;
      --card: #161b22;
      --accent: #ff9f1a;
      --green: #2ee59d;
      --red: #ff6b6b;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    
    body { 
      margin: 0; 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text-main); 
      padding: 15px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 25px; 
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    
    h1 { margin: 0; font-size: 20px; font-weight: 800; }
    .month-picker select { padding: 8px; font-size: 13px; }

    /* Top Stats */
    .top-stats { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 12px; 
      margin-bottom: 20px; 
    }
    
    .stat-box { 
      background: var(--card); 
      padding: 15px; 
      border-radius: 12px; 
      border: 1px solid var(--border);
    }
    
    .stat-box label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; }
    .stat-box .val { font-size: 18px; font-weight: 800; margin-top: 5px; display: block; }
    .stat-box input { 
      background: rgba(255,159,26,0.05); 
      border: 1px solid var(--accent); 
      color: var(--accent); 
      font-size: 18px; 
      font-weight: 800; 
      width: 100%; 
      padding: 5px; 
      border-radius: 6px;
      outline: none;
    }

    /* Tabs */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-link { 
      flex: 1;
      background: none; border: 1px solid var(--border); color: var(--text-dim); 
      padding: 10px 5px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 12px;
    }
    .tab-link.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Smart Alert */
    .alert { padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
    .alert-info { background: rgba(46,229,157,0.1); color: var(--green); }
    .alert-warn { background: rgba(255,107,107,0.1); color: var(--red); }

    /* Form Design - MOBİL ÜÇÜN DÜZƏLİŞ */
    .input-group { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      padding: 15px; 
      background: rgba(255,255,255,0.02); 
    }
    
    @media (min-width: 600px) {
      .input-group { flex-direction: row; }
      .input-group select { flex: 2; }
      .input-group input { flex: 1; }
      .input-group button { flex: 1; }
      h1 { font-size: 28px; }
    }

    input, select { 
      background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 12px; 
      border-radius: 10px; font-size: 14px; width: 100%;
    }

    .btn-primary { 
      background: var(--accent); color: #000; border: none; padding: 14px; 
      border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px;
    }

    /* Table */
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: rgba(255,255,255,0.02); padding: 12px; text-align: left; font-size: 11px; color: var(--text-dim); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }

    /* Analytics */
    .ana-row { 
      display: grid; grid-template-columns: 1.2fr 0.8fr 0.8fr 0.8fr; gap: 8px; 
      padding: 12px; align-items: center; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .target-input { width: 100% !important; padding: 4px !important; font-size: 12px !important; text-align: center; }
    .prog-bar-bg { grid-column: span 4; height: 5px; background: #30363d; border-radius: 5px; overflow: hidden; margin-top: 4px; }
    .prog-bar-fill { height: 100%; transition: 0.4s; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Maliyyə Pro</h1>
    <div class="month-picker">
      <select id="monthSelector" onchange="changeMonth()">
        <option value="May_2026">May 2026</option>
        <option value="Iyun_2026">İyun 2026</option>
        <option value="Iyul_2026">İyul 2026</option>
      </select>
    </div>
  </header>

  <div id="statusMsg" class="alert alert-info">Sistem aktivdir.</div>

  <div class="top-stats">
    <div class="stat-box">
      <label>Maaş</label>
      <input type="number" id="monthlySalary" onchange="updateSalary()">
    </div>
    <div class="stat-box">
      <label>Xərc</label>
      <span class="val" id="totalSpent">0 ₼</span>
    </div>
    <div class="stat-box">
      <label>Qalıq</label>
      <span class="val" id="totalBalance">0 ₼</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button id="tabPlan" class="tab-link active" onclick="switchTab('plan')">Xərclər</button>
    <button id="tabAna" class="tab-link" onclick="switchTab('ana')">Analitika</button>
  </div>

  <div id="sectionPlan" class="card">
    <div class="input-group">
      <select id="expCat"></select>
      <input type="number" id="expAmt" placeholder="Məbləğ" inputmode="decimal">
      <button class="btn-primary" onclick="addExpense()">Əlavə Et</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>KATEQORİYA</th>
          <th>MƏBLƏĞ</th>
          <th style="text-align:right">SİL</th>
        </tr>
      </thead>
      <tbody id="expenseTable"></tbody>
    </table>
  </div>

  <div id="sectionAna" class="card hidden">
    <div id="analyticsTable"></div>
  </div>
</div>

<script>
  const categoryList = [
    "Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", 
    "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", 
    "Baxım", "Həkim", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran"
  ];

  let db = JSON.parse(localStorage.getItem('maliyya_v5_db')) || {};
  let currentMonth = "";

  function init() {
    currentMonth = document.getElementById('monthSelector').value;
    const expCat = document.getElementById('expCat');
    expCat.innerHTML = categoryList.map(c => `<option value="${c}">${c}</option>`).join('');

    if (!db[currentMonth]) {
      db[currentMonth] = {
        salary: 0,
        expenses: [],
        targets: {
            "Kredit": 650, "Şaxnuz maaş": 500, "Komunal": 100, "Xalidə x. komunal": 80,
            "Kontur": 30, "Borc": 100, "Ehtiyat pul": 0, "Benzin": 50, "İstirahət": 350,
            "Paltar": 50, "Baxım": 50, "Həkim": 0, "Bazarlıq": 400, "ARslan bazarlıq": 250,
            "Ət": 50, "Restoran": 100
        }
      };
    }
    document.getElementById('monthlySalary').value = db[currentMonth].salary;
    render();
  }

  function changeMonth() { init(); }

  function updateSalary() {
    db[currentMonth].salary = parseFloat(document.getElementById('monthlySalary').value) || 0;
    save(); render();
  }

  function addExpense() {
    const cat = document.getElementById('expCat').value;
    const amt = parseFloat(document.getElementById('expAmt').value);
    if (!amt) return;
    db[currentMonth].expenses.unshift({ cat, amt, date: new Date().toLocaleDateString() });
    document.getElementById('expAmt').value = "";
    save(); render();
  }

  function deleteExp(idx) {
    db[currentMonth].expenses.splice(idx, 1);
    save(); render();
  }

  function updateTarget(cat, val) {
    db[currentMonth].targets[cat] = parseFloat(val) || 0;
    save(); render();
  }

  function save() { localStorage.setItem('maliyya_v5_db', JSON.stringify(db)); }

  function switchTab(t) {
    document.getElementById('sectionPlan').classList.toggle('hidden', t !== 'plan');
    document.getElementById('sectionAna').classList.toggle('hidden', t !== 'ana');
    document.getElementById('tabPlan').classList.toggle('active', t === 'plan');
    document.getElementById('tabAna').classList.toggle('active', t === 'ana');
  }

  function render() {
    const table = document.getElementById('expenseTable');
    table.innerHTML = db[currentMonth].expenses.map((item, i) => `
      <tr>
        <td><b>${item.cat}</b><br><small style="color:var(--text-dim)">${item.date}</small></td>
        <td style="font-weight:700">${item.amt} ₼</td>
        <td style="text-align:right"><button onclick="deleteExp(${i})" style="background:none; border:none; color:var(--red); font-size:20px;">&times;</button></td>
      </tr>
    `).join('');

    const anaTable = document.getElementById('analyticsTable');
    let totalSpent = 0;
    anaTable.innerHTML = categoryList.map(cat => {
      const target = db[currentMonth].targets[cat] || 0;
      const spent = db[currentMonth].expenses.filter(e => e.cat === cat).reduce((s, e) => s + e.amt, 0);
      totalSpent += spent;
      const diff = target - spent;
      const perc = target > 0 ? Math.min((spent / target) * 100, 100) : (spent > 0 ? 100 : 0);
      return `
        <div class="ana-row">
          <div><b>${cat}</b></div>
          <div><input type="number" class="target-input" value="${target}" onchange="updateTarget('${cat}', this.value)"></div>
          <div style="font-weight:700">${spent}₼</div>
          <div style="color:${diff < 0 ? 'var(--red)' : 'var(--green)'}; font-weight:700">${diff}₼</div>
          <div class="prog-bar-bg">
            <div class="prog-bar-fill" style="width:${perc}%; background:${diff < 0 ? 'var(--red)' : 'var(--accent)'}"></div>
          </div>
        </div>
      `;
    }).join('');

    const salary = db[currentMonth].salary;
    const balance = salary - totalSpent;
    document.getElementById('totalSpent').innerText = totalSpent.toFixed(0) + " ₼";
    document.getElementById('totalBalance').innerText = balance.toFixed(0) + " ₼";
    document.getElementById('totalBalance').style.color = balance < 0 ? 'var(--red)' : 'var(--green)';
    
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = balance < 0 ? "Büdcə aşıldı!" : "Vəziyyət yaxşıdır.";
    statusMsg.className = balance < 0 ? "alert alert-warn" : "alert alert-info";
  }

  init();
</script>
</body>
</html>
