<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Maaş Hesabatı v18 - Final UI</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --accent: #ff9f1a; --green: #2ee59d;
      --red: #ff6b6b; --text-main: #f0f6fc; --text-dim: #8b949e; --border: #30363d;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); padding: 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    /* Select qutusundakı ikiqat ox probleminin həlli */
    .select-wrapper { position: relative; width: 100%; }
    select { 
      appearance: none; /* Standart brauzer oxunu gizlədir */
      -webkit-appearance: none;
      -moz-appearance: none;
      background: #0d1117; 
      border: 1px solid var(--border); 
      color: #fff; 
      padding: 12px; 
      padding-right: 35px; /* Ox üçün yer */
      border-radius: 10px; 
      font-size: 14px; 
      width: 100%; 
      outline: none;
      height: 45px;
      cursor: pointer;
    }
    .select-wrapper::after { 
      content: "▼"; 
      font-size: 10px; 
      position: absolute; 
      right: 15px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: var(--text-dim); 
      pointer-events: none; 
    }

    /* Status və Skala (Progress Bar) dizaynı */
    .status-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status-text { font-size: 14px; font-weight: 800; margin-bottom: 10px; display: block; }
    .main-progress-bg {
      width: 100%;
      height: 12px;
      background: #0d1117;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .main-progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(90deg, var(--green), var(--accent));
      position: relative;
    }
    /* Dolan animasiya effekti */
    .main-progress-fill::after {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background-image: linear-gradient(-45deg, rgba(255,255,255,.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.2) 50%, rgba(255,255,255,.2) 75%, transparent 75%, transparent);
      z-index: 1;
      background-size: 30px 30px;
      animation: move 2s linear infinite;
    }
    @keyframes move { 0% { background-position: 0 0; } 100% { background-position: 30px 30px; } }

    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-box label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 700; }
    .stat-box .val { font-size: 16px; font-weight: 800; display: block; }
    .stat-box input { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 800; width: 100%; outline: none; }

    .input-group { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 15px; background: rgba(255,255,255,0.02); }
    @media (min-width: 768px) { .input-group { grid-template-columns: 2fr 1.5fr 1fr auto; align-items: center; } }

    .btn-primary { background: var(--accent); color: #000; border: none; padding: 0 25px; border-radius: 10px; font-weight: 900; cursor: pointer; height: 45px; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-link { flex: 1; background: var(--card); border: none; color: var(--text-dim); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 12px; }
    .tab-link.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }
    .ana-row { display: grid; grid-template-columns: 1.2fr 0.8fr 0.8fr 0.8fr 0.3fr; gap: 8px; padding: 12px; align-items: center; border-bottom: 1px solid var(--border); font-size: 12px; }
    .target-input { width: 100% !important; padding: 6px !important; background: #0d1117; color: white; border: 1px solid var(--border); border-radius: 6px; }
    .hidden { display: none; }
    .detail-msg { font-size: 12px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 20px; border-left: 3px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand" onclick="window.location.reload()"><span>💸</span> Maaş Hesabatı</div>
    <div class="select-wrapper" style="width: auto;"><select id="monthSelector" onchange="init()"></select></div>
  </header>

  <!-- Yeni Skalalı Status Bölməsi -->
  <div class="status-container">
    <div id="statusMsg" class="status-text">Analiz edilir...</div>
    <div class="main-progress-bg">
      <div id="mainProgressFill" class="main-progress-fill"></div>
    </div>
  </div>

  <div id="detailAlert" class="detail-msg">Analiz hazırlanır...</div>

  <div class="top-stats">
    <div class="stat-box"><label>Aylıq Maaş</label><input type="number" id="monthlySalary" onchange="updateSalary()" placeholder="0"></div>
    <div class="stat-box"><label>Planlanan Cəm</label><span class="val" id="totalPlanned" style="color:var(--accent)">0 ₼</span></div>
    <div class="stat-box"><label>Ümumi Xərc</label><span class="val" id="totalSpent">0 ₼</span></div>
    <div class="stat-box"><label>Qalıq Balans</label><span class="val" id="totalBalance">0 ₼</span></div>
  </div>

  <div class="nav-tabs">
    <button id="tabPlan" class="tab-link active" onclick="switchTab('plan')">Xərclər</button>
    <button id="tabAna" class="tab-link" onclick="switchTab('ana')">Planlama Analizi</button>
  </div>

  <div id="sectionPlan" class="card">
    <div class="input-group">
      <div class="select-wrapper">
        <select id="expCat" onchange="toggleOtherInput()"></select>
      </div>
      <input type="text" id="otherCatInput" class="hidden" placeholder="Xərcin adı">
      <input type="number" id="expAmt" placeholder="Məbləğ ₼" inputmode="decimal">
      <button class="btn-primary" onclick="addExpense()">Əlavə Et</button>
    </div>
    <table><tbody id="expenseTable"></tbody></table>
  </div>

  <div id="sectionAna" class="card hidden">
    <div id="analyticsTable"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAsYLwxEwQpRliICJhr6cklZ5kE-P0jyko",
    authDomain: "maas-hesabat.firebaseapp.com",
    databaseURL: "https://maas-hesabat-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "maas-hesabat",
    storageBucket: "maas-hesabat.firebasestorage.app",
    messagingSenderId: "897685289394",
    appId: "1:897685289394:web:51861c7bf96b908dbd4cab"
  };

  firebase.initializeApp(firebaseConfig);
  const db_fb = firebase.database();

  const baseCategories = ["Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", "Baxım", "Həkim", "Gündəlik bazarlıq", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran", "Digər"];
  const months = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  
  let db = {};
  let currentMonth = "";

  function safeKey(str) { return str.replace(/\./g, '').trim(); }

  function setupMonthSelector() {
    const selector = document.getElementById('monthSelector');
    if(selector.options.length > 0) return;
    months.forEach(m => {
        let opt = document.createElement('option');
        opt.value = `${m}_2026`; opt.innerText = `${m} 2026`;
        selector.appendChild(opt);
    });
    selector.value = months[new Date().getMonth()] + "_2026";
  }

  function init() {
    setupMonthSelector();
    currentMonth = document.getElementById('monthSelector').value;
    document.getElementById('expCat').innerHTML = baseCategories.map(c => `<option value="${c}">${c}</option>`).join('');

    db_fb.ref('maliyya_v12').on('value', (snapshot) => {
      db = snapshot.val() || {};
      if (!db[currentMonth]) db[currentMonth] = { salary: 0, expenses: [], targets: {}, customCats: [] };
      document.getElementById('monthlySalary').value = db[currentMonth].salary || "";
      render();
    });
  }

  function toggleOtherInput() { document.getElementById('otherCatInput').classList.toggle('hidden', document.getElementById('expCat').value !== "Digər"); }

  function updateSalary() { db_fb.ref(`maliyya_v12/${currentMonth}/salary`).set(parseFloat(document.getElementById('monthlySalary').value) || 0); }

  function addExpense() {
    let cat = document.getElementById('expCat').value;
    const otherVal = document.getElementById('otherCatInput').value.trim();
    const amt = parseFloat(document.getElementById('expAmt').value);
    if (cat === "Digər") { if (!otherVal) return; cat = otherVal; }
    if (!amt) return;
    let exps = db[currentMonth].expenses || [];
    exps.unshift({ cat, amt, date: new Date().toLocaleDateString('az-AZ') });
    db_fb.ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
    document.getElementById('expAmt').value = "";
  }

  function deleteExp(idx) {
    let exps = db[currentMonth].expenses;
    exps.splice(idx, 1);
    db_fb.ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
  }

  function updateTarget(cat, val) {
    db_fb.ref(`maliyya_v12/${currentMonth}/targets/${safeKey(cat)}`).set(parseFloat(val) || 0);
  }

  function switchTab(t) {
    document.getElementById('sectionPlan').classList.toggle('hidden', t !== 'plan');
    document.getElementById('sectionAna').classList.toggle('hidden', t !== 'ana');
    document.getElementById('tabPlan').classList.toggle('active', t === 'plan');
    document.getElementById('tabAna').classList.toggle('active', t === 'ana');
  }

  function render() {
    const data = db[currentMonth] || { salary: 0, expenses: [], targets: {}, customCats: [] };
    const expenses = data.expenses || [];
    const targets = data.targets || {};
    
    document.getElementById('expenseTable').innerHTML = expenses.map((item, i) => `
      <tr>
        <td><b>${item.cat}</b><br><small style="color:var(--text-dim)">${item.date}</small></td>
        <td style="font-weight:700">${item.amt} ₼</td>
        <td style="text-align:right"><button onclick="deleteExp(${i})" style="background:none; border:none; color:var(--red); font-size:20px; cursor:pointer;">&times;</button></td>
      </tr>
    `).join('');

    let totalSpent = 0;
    let totalTargetSum = 0;
    let alerts = [];
    const activeCats = [...new Set([...baseCategories.filter(c => c !== "Digər"), ...(data.customCats || [])])];

    activeCats.forEach(cat => {
      const target = targets[safeKey(cat)] || 0;
      totalTargetSum += target;
      const spent = expenses.filter(e => e.cat === cat).reduce((s, e) => s + e.amt, 0);
      totalSpent += spent;
      const diff = target - spent;
      if (target > 0) {
          if (diff < 0) alerts.push(`<span style="color:var(--red)">🔴 <b>${cat}</b>: -${Math.abs(diff.toFixed(0))}₼</span>`);
          else if (spent > 0) alerts.push(`<span style="color:var(--green)">🟢 <b>${cat}</b>: +${diff.toFixed(0)}₼</span>`);
      }
    });

    const salary = data.salary || 0;
    const balance = salary - totalSpent;
    const spentPerc = salary > 0 ? Math.min((totalSpent / salary) * 100, 100) : 0;
    
    document.getElementById('totalPlanned').innerText = totalTargetSum.toFixed(0) + " ₼";
    document.getElementById('totalSpent').innerText = totalSpent.toFixed(0) + " ₼";
    document.getElementById('totalBalance').innerText = balance.toFixed(0) + " ₼";
    document.getElementById('totalBalance').style.color = balance < 0 ? 'var(--red)' : 'var(--green)';
    
    // Progress Bar və Status Yeniləmə
    const progFill = document.getElementById('mainProgressFill');
    const statusMsg = document.getElementById('statusMsg');
    
    progFill.style.width = spentPerc + "%";
    progFill.style.background = spentPerc > 90 ? 'var(--red)' : (spentPerc > 50 ? 'var(--accent)' : 'var(--green)');

    if (salary === 0) { 
        statusMsg.innerText = "Maaş daxil edin."; statusMsg.style.color = "var(--text-dim)";
    } else {
        statusMsg.innerText = `Maaşın ${spentPerc.toFixed(0)}%-i xərclənib (${totalSpent.toFixed(0)} ₼)`;
        statusMsg.style.color = spentPerc > 90 ? 'var(--red)' : 'var(--text-main)';
    }

    document.getElementById('detailAlert').innerHTML = alerts.length > 0 ? alerts.join(" | ") : "Analiz hazırlanır...";
  }

  init();
</script>
</body>
</html>
