<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
    <title>Maaş Hesabatı v12</title>
    
    <!-- Firebase Kitabxanaları (Daha stabil versiya) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #ff9f1a; --green: #2ee59d; --red: #ff6b6b; --text: #f0f6fc; --border: #30363d; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .brand { font-size: 20px; font-weight: 900; color: var(--accent); }
        select, input { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        .alert { padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: center; font-weight: 700; background: var(--card); border: 1px solid var(--border); }
        .top-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--card); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-box label { font-size: 10px; color: #8b949e; display: block; }
        .stat-box span, .stat-box input { font-size: 15px; font-weight: 800; width: 100%; border: none; padding: 0; margin-top: 5px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; background: var(--card); border-radius: 10px; text-align: center; cursor: pointer; font-weight: 700; }
        .tab.active { background: var(--accent); color: #000; }
        .input-group { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px; margin-bottom: 15px; }
        .btn-add { background: var(--accent); border: none; padding: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; border-bottom: 1px solid #30363d; font-size: 14px; }
        .ana-row { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">Maaş Hesabatı</div>
        <select id="monthSelector" onchange="loadData()"></select>
    </header>

    <div id="statusMsg" class="alert">Firebase bağlanır...</div>

    <div class="top-stats">
        <div class="stat-box"><label>MAAŞ</label><input type="number" id="monthlySalary" onchange="updateSalary()"></div>
        <div class="stat-box"><label>XƏRC</label><span id="totalSpent">0 ₼</span></div>
        <div class="stat-box"><label>QALIQ</label><span id="totalBalance">0 ₼</span></div>
    </div>

    <div class="nav-tabs">
        <div id="t1" class="tab active" onclick="showTab('plan')">Xərclər</div>
        <div id="t2" class="tab" onclick="showTab('ana')">Analiz</div>
    </div>

    <div id="sectionPlan">
        <div class="input-group">
            <select id="expCat" onchange="toggleOther()"></select>
            <input type="text" id="otherCat" class="hidden" placeholder="Xərcin adı">
            <input type="number" id="expAmt" placeholder="Məbləğ ₼" inputmode="decimal">
            <button class="btn-add" onclick="addExpense()">ƏLAVƏ ET</button>
        </div>
        <div class="card"><table><tbody id="expenseTable"></tbody></table></div>
    </div>

    <div id="sectionAna" class="hidden"><div class="card" id="analyticsTable"></div></div>
</div>

<script>
    // 1. SƏNİN FİRREBASE MƏLUMATLARIN
    const firebaseConfig = {
        apiKey: "AIzaSyAsYLwxEwQpRliICJhr6cklZ5kE-P0jyko",
        authDomain: "maas-hesabat.firebaseapp.com",
        databaseURL: "https://maas-hesabat-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "maas-hesabat",
        storageBucket: "maas-hesabat.firebasestorage.app",
        messagingSenderId: "897685289394",
        appId: "1:897685289394:web:51861c7bf96b908dbd4cab"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const cats = ["Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", "Baxım", "Həkim", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran", "Digər"];
    const months = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
    let currentDB = {};
    let monthKey = months[new Date().getMonth()] + "_2026";

    // 2. MƏLUMATLARI YÜKLƏMƏK
    function loadData() {
        monthKey = document.getElementById('monthSelector').value;
        db.ref('maliyya_v12').on('value', (snap) => {
            currentDB = snap.val() || {};
            if (!currentDB[monthKey]) currentDB[monthKey] = { salary: 0, expenses: [], targets: {} };
            render();
            document.getElementById('statusMsg').innerText = "✅ Firebase Aktif";
            document.getElementById('statusMsg').style.color = "var(--green)";
        });
    }

    // 3. AY SEÇİMİNİ DOLDUR
    const sel = document.getElementById('monthSelector');
    months.forEach(m => {
        let opt = document.createElement('option');
        opt.value = m + "_2026"; opt.innerText = m + " 2026";
        sel.appendChild(opt);
    });
    sel.value = monthKey;

    document.getElementById('expCat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');

    function updateSalary() {
        const val = parseFloat(document.getElementById('monthlySalary').value) || 0;
        db.ref('maliyya_v12/' + monthKey + '/salary').set(val);
    }

    function addExpense() {
        let cat = document.getElementById('expCat').value;
        if(cat === "Digər") cat = document.getElementById('otherCat').value;
        const amt = parseFloat(document.getElementById('expAmt').value);
        if(!amt || !cat) return;

        const newExp = { cat, amt, date: new Date().toLocaleDateString('az-AZ') };
        const exps = currentDB[monthKey].expenses || [];
        exps.unshift(newExp);
        db.ref('maliyya_v12/' + monthKey + '/expenses').set(exps);
        
        document.getElementById('expAmt').value = "";
        document.getElementById('otherCat').value = "";
    }

    function deleteExp(i) {
        const exps = currentDB[monthKey].expenses;
        exps.splice(i, 1);
        db.ref('maliyya_v12/' + monthKey + '/expenses').set(exps);
    }

    function render() {
        const data = currentDB[monthKey] || { salary: 0, expenses: [] };
        document.getElementById('monthlySalary').value = data.salary || "";
        
        const table = document.getElementById('expenseTable');
        let total = 0;
        table.innerHTML = (data.expenses || []).map((e, i) => {
            total += e.amt;
            return `<tr><td><b>${e.cat}</b><br><small>${e.date}</small></td><td>${e.amt} ₼</td><td onclick="deleteExp(${i})" style="color:var(--red); text-align:right; font-size:18px;">&times;</td></tr>`;
        }).join('');

        document.getElementById('totalSpent').innerText = total + " ₼";
        document.getElementById('totalBalance').innerText = (data.salary - total) + " ₼";

        // Analiz hissəsi
        const ana = document.getElementById('analyticsTable');
        const uniqueCats = [...new Set((data.expenses || []).map(e => e.cat))];
        ana.innerHTML = uniqueCats.map(c => {
            const sum = data.expenses.filter(e => e.cat === c).reduce((a, b) => a + b.amt, 0);
            return `<div class="ana-row"><span>${c}</span><b>${sum} ₼</b></div>`;
        }).join('');
    }

    function showTab(t) {
        document.getElementById('sectionPlan').className = t === 'plan' ? '' : 'hidden';
        document.getElementById('sectionAna').className = t === 'ana' ? '' : 'hidden';
        document.getElementById('t1').className = t === 'plan' ? 'tab active' : 'tab';
        document.getElementById('t2').className = t === 'ana' ? 'tab active' : 'tab';
    }

    function toggleOther() {
        document.getElementById('otherCat').className = document.getElementById('expCat').value === "Digər" ? "" : "hidden";
    }

    loadData();
</script>

</body>
</html>
