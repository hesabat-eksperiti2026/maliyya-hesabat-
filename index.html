<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Maaş Hesabatı v19 - Privacy Mode</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --accent: #ff9f1a; --green: #2ee59d;
      --red: #ff6b6b; --text-main: #f0f6fc; --text-dim: #8b949e; --border: #30363d;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); padding: 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    /* Göz düyməsi stili */
    .eye-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; transition: 0.3s; }
    .eye-btn:hover { color: var(--accent); border-color: var(--accent); }

    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); position: relative; }
    .stat-box label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 700; }
    .stat-box .val { font-size: 16px; font-weight: 800; display: block; }
    .stat-box input { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 800; width: 100%; outline: none; }
    
    /* Gizli rejim üçün klas */
    .hidden-val { filter: blur(0px); letter-spacing: 2px; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-link { flex: 1; background: var(--card); border: none; color: var(--text-dim); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 12px; }
    .tab-link.active { background: var(--accent); color: #000; }
    
    .input-group { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: rgba(255,255,255,0.02); }
    @media (min-width: 600px) { .input-group { flex-direction: row; } }
    
    input, select { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; width: 100%; outline: none; }
    .btn-primary { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 900; cursor: pointer; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }
    
    .ana-row { display: grid; grid-template-columns: 1.2fr 0.8fr 0.8fr 0.8fr 0.3fr; gap: 8px; padding: 12px; align-items: center; border-bottom: 1px solid var(--border); font-size: 12px; }
    .target-input { width: 100% !important; padding: 6px !important; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: white; }
    .prog-bar-bg { grid-column: span 5; height: 4px; background: #30363d; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .prog-bar-fill { height: 100%; transition: 0.6s ease; }
    .hidden { display: none; }
    .select-wrapper { position: relative; width: fit-content; }
    select { appearance: none; padding-right: 30px !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand" onclick="window.location.reload()"><span>💸</span> Maaş</div>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="eye-btn" onclick="togglePrivacy()" id="eyeIcon">👁️</button>
        <div class="select-wrapper"><select id="monthSelector" onchange="init()"></select></div>
    </div>
  </header>

  <div id="statusMsg" class="alert" style="padding:15px; border-radius:12px; margin-bottom:10px; text-align:center; font-weight:700; background:var(--card); border:1px solid var(--border);">Yüklənir...</div>

  <!-- Bu hissə gizlənə bilən hissədir -->
  <div class="top-stats" id="statsContainer">
    <div class="stat-box">
        <label>Aylıq Maaş</label>
        <input type="number" id="monthlySalary" onchange="updateSalary()" placeholder="0">
    </div>
    <div class="stat-box">
        <label>Planlanan</label>
        <span class="val" id="totalPlanned" style="color:var(--accent)">0 ₼</span>
    </div>
    <div class="stat-box">
        <label>Ümumi Xərc</label>
        <span class="val" id="totalSpent">0 ₼</span>
    </div>
    <div class="stat-box">
        <label>Qalıq</label>
        <span class="val" id="totalBalance">0 ₼</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button id="tabPlan" class="tab-link active" onclick="switchTab('plan')">Xərclər</button>
    <button id="tabAna" class="tab-link" onclick="switchTab('ana')">Planlama</button>
  </div>

  <div id="sectionPlan" class="card">
    <div class="input-group">
      <select id="expCat" onchange="toggleOtherInput()"></select>
      <input type="text" id="otherCatInput" class="hidden" placeholder="Xərcin adı">
      <input type="number" id="expAmt" placeholder="Məbləğ ₼" inputmode="decimal">
      <button class="btn-primary" onclick="addExpense()">Əlavə Et</button>
    </div>
    <table><tbody id="expenseTable"></tbody></table>
  </div>

  <div id="sectionAna" class="card hidden">
    <div id="analyticsTable"></div>
  </div>
</div>

<script>
  // Firebase Konfiqurasiyası
  const firebaseConfig = {
    apiKey: "AIzaSyAsYLwxEwQpRliICJhr6cklZ5kE-P0jyko",
    authDomain: "maas-hesabat.firebaseapp.com",
    databaseURL: "https://maas-hesabat-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "maas-hesabat",
    storageBucket: "maas-hesabat.firebasestorage.app",
    messagingSenderId: "897685289394",
    appId: "1:897685289394:web:51861c7bf96b908dbd4cab"
  };

  firebase.initializeApp(firebaseConfig);
  const db_fb = firebase.database();

  const baseCategories = ["Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", "Baxım", "Həkim", "Gündəlik bazarlıq", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran", "Digər"];
  const months = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  
  let db = {};
  let currentMonth = "";
  let isPrivate = false;

  // Gizlilik funksiyası
  function togglePrivacy() {
    isPrivate = !isPrivate;
    document.getElementById('eyeIcon').innerText = isPrivate ? "🙈" : "👁️";
    render();
  }

  function safeKey(str) {
    return str.replace(/\./g, '').trim();
  }

  function setupMonthSelector() {
    const selector = document.getElementById('monthSelector');
    if(selector.options.length > 0) return;
    months.forEach(m => {
        let opt = document.createElement('option');
        opt.value = `${m}_2026`; opt.innerText = `${m} 2026`;
        selector.appendChild(opt);
    });
    selector.value = months[new Date().getMonth()] + "_2026";
  }

  function init() {
    setupMonthSelector();
    currentMonth = document.getElementById('monthSelector').value;
    document.getElementById('expCat').innerHTML = baseCategories.map(c => `<option value="${c}">${c}</option>`).join('');

    db_fb.ref('maliyya_v12').on('value', (snapshot) => {
      db = snapshot.val() || {};
      render();
    });
  }

  function updateSalary() {
    db_fb.ref(`maliyya_v12/${currentMonth}/salary`).set(parseFloat(document.getElementById('monthlySalary').value) || 0);
  }

  function addExpense() {
    let cat = document.getElementById('expCat').value;
    if(cat === "Digər") cat = document.getElementById('otherCatInput').value.trim();
    const amt = parseFloat(document.getElementById('expAmt').value);
    if (!cat || !amt) return;

    let exps = (db[currentMonth] || {}).expenses || [];
    exps.unshift({ cat, amt, date: new Date().toLocaleDateString('az-AZ') });
    db_fb.ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
    document.getElementById('expAmt').value = "";
  }

  function updateTarget(cat, val) {
    db_fb.ref(`maliyya_v12/${currentMonth}/targets/${safeKey(cat)}`).set(parseFloat(val) || 0);
  }

  function render() {
    const data = db[currentMonth] || { salary: 0, expenses: [], targets: {}, customCats: [] };
    const salaryInput = document.getElementById('monthlySalary');
    
    // Privacy tətbiqi
    if (isPrivate) {
        salaryInput.type = "password";
        salaryInput.value = data.salary || 0;
    } else {
        salaryInput.type = "number";
        salaryInput.value = data.salary || 0;
    }

    const expenses = data.expenses || [];
    document.getElementById('expenseTable').innerHTML = expenses.map((item, i) => `
      <tr>
        <td><b>${item.cat}</b></td>
        <td style="font-weight:700">${isPrivate ? '****' : item.amt + ' ₼'}</td>
        <td style="text-align:right"><button onclick="deleteExp(${i})" style="background:none; border:none; color:var(--red); font-size:18px;">&times;</button></td>
      </tr>
    `).join('');

    let totalSpent = 0, totalTargetSum = 0;
    const activeCats = [...new Set([...baseCategories.filter(c => c !== "Digər"), ...(data.customCats || [])])];

    document.getElementById('analyticsTable').innerHTML = activeCats.map(cat => {
      const target = (data.targets || {})[safeKey(cat)] || 0;
      const spent = expenses.filter(e => e.cat === cat).reduce((s, e) => s + e.amt, 0);
      totalTargetSum += target; totalSpent += spent;
      const diff = target - spent;
      
      return `
        <div class="ana-row">
          <div><b>${cat}</b></div>
          <div><input type="number" class="target-input" value="${target}" onchange="updateTarget('${cat}', this.value)"></div>
          <div style="font-weight:700">${isPrivate ? '***' : spent + '₼'}</div>
          <div style="color:${diff < 0 ? 'var(--red)' : 'var(--green)'}">${isPrivate ? '***' : diff.toFixed(0) + '₼'}</div>
          <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${target > 0 ? (spent/target)*100 : 0}%; background:var(--accent)"></div></div>
        </div>`;
    }).join('');

    document.getElementById('totalPlanned').innerText = isPrivate ? "****" : totalTargetSum.toFixed(0) + " ₼";
    document.getElementById('totalSpent').innerText = isPrivate ? "****" : totalSpent.toFixed(0) + " ₼";
    const balance = (data.salary || 0) - totalSpent;
    document.getElementById('totalBalance').innerText = isPrivate ? "****" : balance.toFixed(0) + " ₼";
    document.getElementById('statusMsg').innerText = balance < 0 ? "Büdcə aşıldı!" : "Vəziyyət normaldır.";
  }

  function toggleOtherInput() { document.getElementById('otherCatInput').classList.toggle('hidden', document.getElementById('expCat').value !== "Digər"); }
  function switchTab(t) { 
    document.getElementById('sectionPlan').classList.toggle('hidden', t !== 'plan'); 
    document.getElementById('sectionAna').classList.toggle('hidden', t !== 'ana');
    document.getElementById('tabPlan').classList.toggle('active', t === 'plan');
    document.getElementById('tabAna').classList.toggle('active', t === 'ana');
  }
  function deleteExp(i) {
    let exps = db[currentMonth].expenses;
    exps.splice(i, 1);
    db_fb.ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
  }

  init();
</script>
</body>
</html>
