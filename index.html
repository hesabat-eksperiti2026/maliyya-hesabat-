<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Maaş Hesabatı v19</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --accent: #ff9f1a; --green: #2ee59d;
      --red: #ff6b6b; --text-main: #f0f6fc; --text-dim: #8b949e; --border: #30363d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); padding: 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    .select-wrapper { position: relative; width: 100%; }
    select, input { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; width: 100%; outline: none; }
    
    .status-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .status-text { font-size: 14px; font-weight: 800; margin-bottom: 10px; text-align: center; display: block; }
    .progress-track { width: 100%; height: 10px; background: #0d1117; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), var(--accent)); transition: width 0.8s ease; }

    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-box label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 700; }
    .stat-box .val { font-size: 16px; font-weight: 800; display: block; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-link { flex: 1; background: var(--card); border: none; color: var(--text-dim); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .tab-link.active { background: var(--accent); color: #000; }

    .btn-primary { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 900; cursor: pointer; }

    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.02); }
    
    .hidden { display: none !important; }

    /* Login Screen */
    #loginScreen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; }
    .login-box { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2 style="color:var(--accent); margin-bottom:10px;">Giriş</h2>
    <p style="color:var(--text-dim); font-size:13px; margin-bottom:20px;">Şifrəni daxil edin</p>
    <input type="password" id="passInput" placeholder="****" style="text-align:center; font-size:24px; margin-bottom:15px;">
    <button class="btn-primary" style="width:100%" onclick="checkPassword()">DAXİL OL</button>
  </div>
</div>

<div id="mainApp" class="container hidden">
  <header>
    <div class="brand"><span>💸</span> Maaş Hesabatı</div>
    <div style="width:140px"><select id="monthSelector" onchange="init()"></select></div>
  </header>

  <div class="status-card">
    <div id="statusMsg" class="status-text">Yüklənir...</div>
    <div class="progress-track"><div id="mainProgressBar" class="progress-bar"></div></div>
  </div>

  <div class="top-stats">
    <div class="stat-box"><label>Maaş</label><input type="number" id="monthlySalary" onchange="updateSalary()" style="padding:0; background:none; border:none; font-size:16px; font-weight:800; color:var(--accent)"></div>
    <div class="stat-box"><label>Plan</label><span class="val" id="totalPlanned">0 ₼</span></div>
    <div class="stat-box"><label>Xərc</label><span class="val" id="totalSpent">0 ₼</span></div>
    <div class="stat-box"><label>Qalıq</label><span class="val" id="totalBalance">0 ₼</span></div>
  </div>

  <div class="nav-tabs">
    <button id="tabPlan" class="tab-link active" onclick="switchTab('plan')">Xərclər</button>
    <button id="tabAna" class="tab-link" onclick="switchTab('ana')">Analiz</button>
  </div>

  <div id="sectionPlan" class="card">
    <div style="padding:15px; display:flex; flex-direction:column; gap:10px;">
        <select id="expCat"></select>
        <input type="number" id="expAmt" placeholder="Məbləğ">
        <button class="btn-primary" onclick="addExpense()">Əlavə Et</button>
    </div>
    <table><tbody id="expenseTable"></tbody></table>
  </div>

  <div id="sectionAna" class="card hidden">
    <div id="analyticsTable"></div>
  </div>
</div>

<script>
  const RAZ_PASS = "1907";
  
  function checkPassword() {
    const val = document.getElementById('passInput').value;
    if(val === RAZ_PASS) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      startApp();
    } else {
      alert("Şifrə səhvdir!");
    }
  }

  document.getElementById('passInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPassword(); });

  function startApp() {
    const firebaseConfig = {
      apiKey: "AIzaSyAsYLwxEwQpRliICJhr6cklZ5kE-P0jyko",
      authDomain: "maas-hesabat.firebaseapp.com",
      databaseURL: "https://maas-hesabat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "maas-hesabat",
      storageBucket: "maas-hesabat.firebasestorage.app",
      messagingSenderId: "897685289394",
      appId: "1:897685289394:web:51861c7bf96b908dbd4cab"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    init();
  }

  const baseCategories = ["Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", "Baxım", "Həkim", "Gündəlik bazarlıq", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran", "Digər"];
  const months = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  let db = {};
  let currentMonth = "";

  function init() {
    const selector = document.getElementById('monthSelector');
    if(selector.options.length === 0) {
        months.forEach(m => {
            let opt = document.createElement('option');
            opt.value = m + "_2026"; opt.innerText = m + " 2026";
            selector.appendChild(opt);
        });
        selector.value = months[new Date().getMonth()] + "_2026";
    }
    currentMonth = selector.value;

    firebase.database().ref('maliyya_v12').on('value', (snap) => {
      db = snap.val() || {};
      render();
    });
  }

  function render() {
    const data = db[currentMonth] || { salary: 0, expenses: [], targets: {} };
    document.getElementById('monthlySalary').value = data.salary || 0;
    
    const exps = data.expenses || [];
    document.getElementById('expenseTable').innerHTML = exps.map((e, i) => `
      <tr>
        <td><b>${e.cat}</b><br><small>${e.date}</small></td>
        <td>${e.amt} ₼</td>
        <td style="text-align:right"><button onclick="deleteExp(${i})" style="background:none; border:none; color:var(--red); font-size:18px;">&times;</button></td>
      </tr>
    `).join('');

    const cats = [...new Set([...baseCategories, ...(data.customCats || [])])];
    document.getElementById('expCat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');

    let totalSpent = exps.reduce((s, e) => s + e.amt, 0);
    let totalPlanned = Object.values(data.targets || {}).reduce((s, v) => s + v, 0);
    
    document.getElementById('totalSpent').innerText = totalSpent + " ₼";
    document.getElementById('totalPlanned').innerText = totalPlanned + " ₼";
    document.getElementById('totalBalance').innerText = (data.salary - totalSpent) + " ₼";
    
    let perc = data.salary > 0 ? (totalSpent / data.salary) * 100 : 0;
    document.getElementById('mainProgressBar').style.width = Math.min(perc, 100) + "%";
    document.getElementById('statusMsg').innerText = `Maaşın ${perc.toFixed(0)}%-i xərclənib.`;
  }

  function updateSalary() {
    const val = parseFloat(document.getElementById('monthlySalary').value) || 0;
    firebase.database().ref(`maliyya_v12/${currentMonth}/salary`).set(val);
  }

  function addExpense() {
    const cat = document.getElementById('expCat').value;
    const amt = parseFloat(document.getElementById('expAmt').value);
    if(!amt) return;
    
    let exps = (db[currentMonth] && db[currentMonth].expenses) || [];
    exps.unshift({ cat, amt, date: new Date().toLocaleDateString('az-AZ') });
    firebase.database().ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
    document.getElementById('expAmt').value = "";
  }

  function deleteExp(i) {
    let exps = db[currentMonth].expenses;
    exps.splice(i, 1);
    firebase.database().ref(`maliyya_v12/${currentMonth}/expenses`).set(exps);
  }

  function switchTab(t) {
    document.getElementById('sectionPlan').classList.toggle('hidden', t !== 'plan');
    document.getElementById('sectionAna').classList.toggle('hidden', t !== 'ana');
    document.getElementById('tabPlan').classList.toggle('active', t === 'plan');
    document.getElementById('tabAna').classList.toggle('active', t === 'ana');
  }
</script>
</body>
</html>
