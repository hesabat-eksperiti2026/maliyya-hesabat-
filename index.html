<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Maaş Hesabatı v12 (Firebase Live)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --accent: #ff9f1a; --green: #2ee59d;
      --red: #ff6b6b; --text-main: #f0f6fc; --text-dim: #8b949e; --border: #30363d;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); padding: 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); cursor: pointer; user-select: none; }
    .select-wrapper { position: relative; width: fit-content; }
    .select-wrapper::after { content: "▼"; font-size: 10px; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    select { appearance: none; padding-right: 30px !important; background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; }
    .alert { padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; font-weight: 700; text-align: center; border: 1px solid transparent; }
    .alert-info { background: rgba(46,229,157,0.1); color: var(--green); border-color: rgba(46,229,157,0.2); }
    .alert-warn { background: rgba(255,107,107,0.1); color: var(--red); border-color: rgba(255,107,107,0.2); }
    .alert-neutral { background: var(--card); color: var(--text-dim); border-color: var(--border); }
    .detail-msg { font-size: 12px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 20px; color: var(--text-main); line-height: 1.8; border-left: 3px solid var(--accent); }
    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-box label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 700; }
    .stat-box .val { font-size: 16px; font-weight: 800; display: block; }
    .stat-box input { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 800; width: 100%; outline: none; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-link { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 12px; }
    .tab-link.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .input-group { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: rgba(255,255,255,0.02); }
    @media (min-width: 600px) { .input-group { flex-direction: row; } }
    input { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; width: 100%; }
    .btn-primary { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 900; cursor: pointer; min-width: 50px; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }
    .ana-row { display: grid; grid-template-columns: 1.2fr 0.8fr 0.8fr 0.8fr; gap: 8px; padding: 12px; align-items: center; border-bottom: 1px solid var(--border); font-size: 12px; }
    .target-input { width: 100% !important; padding: 4px !important; font-size: 12px !important; text-align: center; border-style: dashed !important; }
    .prog-bar-bg { grid-column: span 4; height: 4px; background: #30363d; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .prog-bar-fill { height: 100%; transition: 0.6s ease; }
    .hidden { display: none; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ Sənin Firebase Konfiqurasiyan əlavə edildi
    const firebaseConfig = {
      apiKey: "AIzaSyAsYLwxEwQpRliICJhr6cklZ5kE-P0jyko",
      authDomain: "maas-hesabat.firebaseapp.com",
      databaseURL: "https://maas-hesabat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "maas-hesabat",
      storageBucket: "maas-hesabat.firebasestorage.app",
      messagingSenderId: "897685289394",
      appId: "1:897685289394:web:51861c7bf96b908dbd4cab"
    };

    const app = initializeApp(firebaseConfig);
    const db_fb = getDatabase(app);

    window.baseCategories = ["Kredit", "Şaxnuz maaş", "Komunal", "Xalidə x. komunal", "Kontur", "Borc", "Ehtiyat pul", "Benzin", "İstirahət", "Paltar", "Baxım", "Həkim", "Bazarlıq", "ARslan bazarlıq", "Ət", "Restoran", "Digər"];
    window.months = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
    
    let localDB = {};
    let currentMonth = window.months[new Date().getMonth()] + "_2026";

    const dbRef = ref(db_fb, 'maliyya_v12');
    onValue(dbRef, (snapshot) => {
      localDB = snapshot.val() || {};
      init();
    });

    window.init = function() {
      const selector = document.getElementById('monthSelector');
      if(selector.options.length === 0) {
        window.months.forEach(m => {
          let opt = document.createElement('option');
          opt.value = `${m}_2026`; opt.innerText = `${m} 2026`;
          selector.appendChild(opt);
        });
        selector.value = currentMonth;
      }
      currentMonth = selector.value;

      if (!localDB[currentMonth]) {
        localDB[currentMonth] = { salary: 0, expenses: [], targets: {}, customCats: [] };
      }
      
      document.getElementById('monthlySalary').value = localDB[currentMonth].salary || "";
      document.getElementById('expCat').innerHTML = window.baseCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      render();
    };

    window.saveToFirebase = function() {
      set(ref(db_fb, 'maliyya_v12'), localDB);
    };

    window.updateSalary = function() {
      localDB[currentMonth].salary = parseFloat(document.getElementById('monthlySalary').value) || 0;
      window.saveToFirebase();
    };

    window.addExpense = function() {
      let cat = document.getElementById('expCat').value;
      const otherVal = document.getElementById('otherCatInput').value.trim();
      const amt = parseFloat(document.getElementById('expAmt').value);
      
      if (cat === "Digər") {
          if (!otherVal) return alert("Xərc adını yazın!");
          cat = otherVal;
          if (!localDB[currentMonth].customCats) localDB[currentMonth].customCats = [];
          if (!localDB[currentMonth].customCats.includes(cat)) localDB[currentMonth].customCats.push(cat);
      }
      if (!amt) return;
      
      if(!localDB[currentMonth].expenses) localDB[currentMonth].expenses = [];
      localDB[currentMonth].expenses.unshift({ cat, amt, date: new Date().toLocaleDateString('az-AZ') });
      
      document.getElementById('expAmt').value = "";
      document.getElementById('otherCatInput').value = "";
      document.getElementById('otherCatInput').classList.add('hidden');
      document.getElementById('expCat').value = "Kredit";
      window.saveToFirebase();
    };

    window.deleteExp = function(idx) {
      localDB[currentMonth].expenses.splice(idx, 1);
      window.saveToFirebase();
    };

    window.updateTarget = function(cat, val) {
      if(!localDB[currentMonth].targets) localDB[currentMonth].targets = {};
      localDB[currentMonth].targets[cat] = parseFloat(val) || 0;
      window.saveToFirebase();
    };

    window.render = function() {
      const table = document.getElementById('expenseTable');
      const exps = localDB[currentMonth].expenses || [];
      table.innerHTML = exps.map((item, i) => `
        <tr>
          <td><b>${item.cat}</b><br><small style="color:var(--text-dim)">${item.date}</small></td>
          <td style="font-weight:700">${item.amt} ₼</td>
          <td style="text-align:right"><button onclick="deleteExp(${i})" style="background:none; border:none; color:var(--red); font-size:20px; cursor:pointer;">&times;</button></td>
        </tr>`).join('');

      const anaTable = document.getElementById('analyticsTable');
      let totalSpent = 0;
      let alerts = [];
      const custom = localDB[currentMonth].customCats || [];
      const activeCats = [...new Set([...window.baseCategories.filter(c => c !== "Digər"), ...custom])];

      anaTable.innerHTML = activeCats.map(cat => {
        const targets = localDB[currentMonth].targets || {};
        const target = targets[cat] || 0;
        const spent = exps.filter(e => e.cat === cat).reduce((s, e) => s + e.amt, 0);
        totalSpent += spent;
        const diff = target - spent;
        const perc = target > 0 ? Math.min((spent / target) * 100, 100) : (spent > 0 ? 100 : 0);
        
        if (target > 0) {
            if (diff < 0) alerts.push(`<span style="color:var(--red)">🔴 <b>${cat}</b>: -${Math.abs(diff.toFixed(0))}₼ artıq.</span>`);
            else if (spent > 0) alerts.push(`<span style="color:var(--green)">🟢 <b>${cat}</b>: ${diff.toFixed(0)}₼ qənaət.</span>`);
        }

        return `<div class="ana-row">
            <div><b>${cat}</b></div>
            <div><input type="number" class="target-input" value="${target}" onchange="updateTarget('${cat}', this.value)"></div>
            <div style="font-weight:700">${spent}₼</div>
            <div style="color:${diff < 0 ? 'var(--red)' : 'var(--green)'}">${diff.toFixed(0)}₼</div>
            <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${perc}%; background:${diff < 0 ? 'var(--red)' : 'var(--accent)'}"></div></div>
          </div>`;
      }).join('');

      const salary = localDB[currentMonth].salary || 0;
      const balance = salary - totalSpent;
      const spentPerc = salary > 0 ? (totalSpent / salary) * 100 : 0;
      
      document.getElementById('totalSpent').innerText = totalSpent.toFixed(0) + " ₼";
      document.getElementById('totalBalance').innerText = balance.toFixed(0) + " ₼";
      document.getElementById('totalBalance').style.color = balance < 0 ? 'var(--red)' : 'var(--green)';
      
      const statusMsg = document.getElementById('statusMsg');
      if (salary === 0) { statusMsg.innerText = "Maaş daxil edin."; statusMsg.className = "alert alert-neutral"; }
      else {
          statusMsg.innerText = spentPerc > 50 ? `Vəziyyət Orta: ${spentPerc.toFixed(0)}% xərclənib.` : `Vəziyyət Yaxşı: ${spentPerc.toFixed(0)}% xərclənib.`;
          statusMsg.className = spentPerc > 85 ? "alert alert-warn" : "alert alert-info";
      }

      document.getElementById('detailAlert').innerHTML = alerts.length > 0 ? alerts.join("<br>") : "Hədəflər daxilindəsiniz.";
    };
  </script>
</head>
<body>

<div class="container">
  <header>
    <div class="brand" onclick="window.location.reload()">Maaş Hesabatı</div>
    <div class="select-wrapper">
      <select id="monthSelector" onchange="init()"></select>
    </div>
  </header>

  <div id="statusMsg" class="alert alert-neutral">Firebase-ə bağlanır...</div>
  <div id="detailAlert" class="detail-msg">Analiz hazırlanır...</div>

  <div class="top-stats">
    <div class="stat-box"><label>Maaş</label><input type="number" id="monthlySalary" onchange="updateSalary()"></div>
    <div class="stat-box"><label>Xərc</label><span class="val" id="totalSpent">0 ₼</span></div>
    <div class="stat-box"><label>Qalıq</label><span class="val" id="totalBalance">0 ₼</span></div>
  </div>

  <div class="nav-tabs">
    <button id="tabPlan" class="tab-link active" onclick="switchTab('plan')">Xərclər</button>
    <button id="tabAna" class="tab-link" onclick="switchTab('ana')">Analiz</button>
  </div>

  <div id="sectionPlan" class="card">
    <div class="input-group">
      <div class="select-wrapper" style="width:100%">
        <select id="expCat" onchange="document.getElementById('otherCatInput').classList.toggle('hidden', this.value !== 'Digər')" style="width:100%"></select>
      </div>
      <input type="text" id="otherCatInput" class="hidden" placeholder="Xərc adı">
      <input type="number" id="expAmt" placeholder="Məbləğ ₼" inputmode="decimal">
      <button class="btn-primary" onclick="addExpense()">+</button>
    </div>
    <table><tbody id="expenseTable"></tbody></table>
  </div>

  <div id="sectionAna" class="card hidden"><div id="analyticsTable"></div></div>
</div>

<script>
  function switchTab(t) {
    document.getElementById('sectionPlan').classList.toggle('hidden', t !== 'plan');
    document.getElementById('sectionAna').classList.toggle('hidden', t !== 'ana');
    document.getElementById('tabPlan').classList.toggle('active', t === 'plan');
    document.getElementById('tabAna').classList.toggle('active', t === 'ana');
  }
</script>
</body>
</html>
